<style id="cdl-theme-styles">
/* Night palette and the short falling-star transition. */
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--paper:#151d18;--cream:#202b22;--white:#202a23;--ink:#eee9df;--muted:#bac2b4;--green:#bed1b1;--green-dark:#d4e2ca;--sage:#2b382c;--line:#3b493d;--gold:#d6b17d;--amber:#dfbb84;--shadow:0 8px 30px #0000001a}
.theme-toggle{display:inline-grid;place-items:center;position:relative;flex-shrink:0;width:39px;height:39px;border:1px solid #d9e0d0;border-radius:50%;background:#f4f6ed;color:#496647;padding:0;line-height:1;cursor:pointer;transition:background .22s,border-color .22s,transform .22s}
.theme-toggle:hover{background:#e7eddf;border-color:#afc19c;transform:rotate(-8deg)}
.theme-toggle:focus-visible{outline:2px solid var(--green);outline-offset:4px}
.theme-toggle svg{width:20px;height:20px;pointer-events:none}
.theme-toggle .theme-sun{display:none}
:root[data-theme="dark"] .theme-toggle{background:#26372b;border-color:#49604a;color:#e8d4a2}
:root[data-theme="dark"] .theme-toggle:hover{background:#334534;border-color:#7b9466}
:root[data-theme="dark"] .theme-toggle .theme-sun{display:block}
:root[data-theme="dark"] .theme-toggle .theme-moon{display:none}
.login-form-panel{position:relative}
.login-theme-row{position:absolute;top:24px;right:28px}
.login-form-panel>.back-link{padding-right:46px}
.public-header nav{gap:20px}
.theme-switching body,.theme-switching :is(.sidebar,.topbar,.public-header,.public-footer,.panel,.product-card,.stat-card,.admin-metric,.admin-period-panel,.login-form-panel,.receipt-paper,.category-tab){transition:background-color .3s ease,color .3s ease,border-color .3s ease}
