<div class="bar-chart" role="img" aria-label="Completed paid sales by day">{% for day in chart %}<div class="bar-column"><span class="bar-tooltip">{{ day.date|date:'M j' }} · ₱{{ day.amount|floatformat:2 }}</span><div class="bar-track"><div class="bar-fill {% if forloop.last %}current{% endif %}" style="height:{{ day.height }}%"></div></div><span>{{ day.label }}</span></div>{% endfor %}</div>
