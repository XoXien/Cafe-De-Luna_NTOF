<style id="cdl-theme-styles">
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--paper:#131c17;--white:#1c2820;--cream:#253329;--ink:#f3eee2;--muted:#b5c0ad;--line:#364739;--green:#aec7a0;--green-dark:#c0d9b2;--primary:#365c43;--primary-hover:#426e50;--on-primary:#fff9eb;--sage:#293c2c;--gold:#d5af77;--amber:#dfb87b;--warning-bg:#3c3321;--danger:#e1a18a;--danger-bg:#3d2a24;--success:#b0cc9b;--success-bg:#293e2d;--info:#a8c7d5;--info-bg:#273943;--art:#2a382a;--shadow:0 8px 28px #00000016}
.theme-toggle{width:42px;height:42px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:50%;padding:0;background:var(--white);color:var(--green);flex-shrink:0;cursor:pointer;touch-action:manipulation;position:relative}.theme-toggle:hover{background:var(--sage)}.theme-toggle:focus-visible{outline:2px solid var(--green);outline-offset:4px}.theme-toggle svg{width:21px;height:21px;pointer-events:none}.theme-toggle .theme-sun{display:none}:root[data-theme="dark"] .theme-toggle .theme-sun{display:block}:root[data-theme="dark"] .theme-toggle .theme-moon{display:none}:root[data-theme="dark"] .theme-toggle{color:#e9d2a2}
.theme-switching body,.theme-switching :is(.sidebar,.topbar,.public-header,.public-footer,.panel,.product-card,.stat-card,.admin-metric,.admin-period-panel,.login-form-panel,.receipt-paper,.category-tab){transition:background-color .28s,color .28s,border-color .28s}
.theme-starfall{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2147483000;contain:strict}.theme-falling-star{position:absolute;top:-32px;left:var(--star-left);width:var(--star-size);height:var(--star-size);opacity:0;will-change:transform,opacity;animation:theme-star-fall var(--star-duration) cubic-bezier(.24,.5,.7,1) var(--star-delay) both}.theme-falling-star::before{content:'';position:absolute;inset:0;background:var(--star-color);clip-path:polygon(50% 0,62% 36%,100% 50%,62% 64%,50% 100%,38% 64%,0 50%,38% 36%)}.theme-falling-star::after{content:'';position:absolute;bottom:100%;left:45%;width:1px;height:25px;background:linear-gradient(to top,#ead9ad55,transparent);transform:rotate(-4deg);transform-origin:bottom center}@keyframes theme-star-fall{0%{opacity:0;transform:translate3d(0,-20px,0) rotate(-10deg)}12%{opacity:.8}70%{opacity:.55}100%{opacity:0;transform:translate3d(var(--star-drift),calc(100vh + 64px),0) rotate(45deg)}}
@media(max-width:560px){.theme-toggle{width:36px;height:38px}.theme-toggle svg{width:19px;height:19px}.login-theme-row{top:22px;right:23px}}
@media(prefers-reduced-motion:reduce){.theme-starfall{display:none!important}.theme-falling-star{animation:none!important}.theme-switching body,.theme-switching *{transition:none!important}}
@media print{.theme-starfall,.theme-toggle{display:none!important}:root[data-theme="dark"]{color-scheme:light}:root[data-theme="dark"] body.receipt-page,:root[data-theme="dark"] .receipt-paper{background:#fff!important;color:#000!important}:root[data-theme="dark"] .receipt-paper *{color:#000!important}:root[data-theme="dark"] .receipt-logo{filter:none!important}}
</style>
