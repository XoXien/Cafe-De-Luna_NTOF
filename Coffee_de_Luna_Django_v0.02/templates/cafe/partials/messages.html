{% if messages %}<div class="messages" aria-live="polite">{% for message in messages %}<div class="message {{ message.tags }}"><svg class="icon"><use href="{% if message.tags == 'error' %}#i-alert{% else %}#i-check{% endif %}"/></svg><span>{{ message }}</span><button type="button" class="icon-button" data-dismiss aria-label="Dismiss message"><svg class="icon"><use href="#i-close"/></svg></button></div>{% endfor %}</div>{% endif %}
